name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scan current files for secrets
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -)
          tar -xzf "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" dir . --redact=100 --no-banner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx next typegen && npm run typecheck
      - run: npm test
